
name: Deploy NGO Frontend

on:
  push:
    branches:
      - prod

permissions:
  id-token: write
  contents: read

concurrency:
  group: ngo-fe-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ap-south-1

      - name: Deploy through SSM
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "i-07b58c34d9a1dc7fc" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy NGO Frontend from GitHub Actions" \
            --parameters 'commands=[
              "set -e",
              "cd /home/ec2-user/ngo-fe",
              "git fetch origin prod",
              "git reset --hard origin/prod",
              "npm ci",
              "npm run build",
              "pm2 restart ngo-fe",
              "pm2 save"
            ]' \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "i-07b58c34d9a1dc7fc"

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "i-07b58c34d9a1dc7fc" \
            --query "{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}" \
            --output json

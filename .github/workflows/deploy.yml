
name: Deploy Admin Frontend

on:
  push:
    branches:
      - prod
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: ngo-fe-admin-production
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      S3_BUCKET: ${{ vars.S3_BUCKET }}
      EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
      NEXT_PUBLIC_API_BASE_URL: ${{ vars.NEXT_PUBLIC_API_BASE_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js application
        run: npm run build

      - name: Package standalone build
        shell: bash
        run: |
          set -euo pipefail
          test -d .next/standalone
          rm -rf .deploy
          mkdir -p .deploy/.next
          cp -a .next/standalone/. .deploy/
          cp -a .next/static .deploy/.next/static
          if [ -d public ]; then
            cp -a public .deploy/public
          fi
          tar -czf "$RUNNER_TEMP/ngo-fe-release.tar.gz" -C .deploy .
          echo "RELEASE_ARCHIVE=$RUNNER_TEMP/ngo-fe-release.tar.gz" >> "$GITHUB_ENV"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Upload release to S3
        run: |
          set -euo pipefail
          aws s3 cp "$RELEASE_ARCHIVE" \
            "s3://${S3_BUCKET}/releases/${GITHUB_SHA}.tar.gz"

      - name: Deploy on EC2 through SSM
        shell: bash
        run: |
          set -euo pipefail

          cat > "$RUNNER_TEMP/deploy-remote.sh" <<'REMOTE'
          set -Eeuo pipefail

          APP_DIR="/home/ec2-user/ngo-fe"
          RELEASE_ID="__RELEASE_ID__"
          BUCKET="__BUCKET__"
          RELEASE_DIR="$APP_DIR/releases/$RELEASE_ID"
          ARCHIVE="/tmp/ngo-fe-$RELEASE_ID.tar.gz"
          PREVIOUS_TARGET="$(readlink -f "$APP_DIR/current" 2>/dev/null || true)"

          mkdir -p "$APP_DIR/releases"
          aws s3 cp "s3://$BUCKET/releases/$RELEASE_ID.tar.gz" "$ARCHIVE"
          mkdir -p "$RELEASE_DIR"
          tar -xzf "$ARCHIVE" -C "$RELEASE_DIR"
          rm -f "$ARCHIVE"

          cat > "$APP_DIR/ecosystem.config.cjs" <<'PM2'
          module.exports = {
            apps: [{
              name: "ngo-fe",
              script: "/home/ec2-user/ngo-fe/current/server.js",
              cwd: "/home/ec2-user/ngo-fe/current",
              instances: 1,
              exec_mode: "fork",
              autorestart: true,
              watch: false,
              env: {
                NODE_ENV: "production",
                PORT: "3000",
                HOSTNAME: "127.0.0.1"
              }
            }]
          };
          PM2

          chown -R ec2-user:ec2-user "$APP_DIR"
          ln -sfn "$RELEASE_DIR" "$APP_DIR/current"
          chown -h ec2-user:ec2-user "$APP_DIR/current"

          if ! sudo -iu ec2-user pm2 startOrRestart "$APP_DIR/ecosystem.config.cjs" --update-env; then
            if [ -n "$PREVIOUS_TARGET" ] && [ -d "$PREVIOUS_TARGET" ]; then
              ln -sfn "$PREVIOUS_TARGET" "$APP_DIR/current"
              chown -h ec2-user:ec2-user "$APP_DIR/current"
              sudo -iu ec2-user pm2 startOrRestart "$APP_DIR/ecosystem.config.cjs" --update-env || true
            fi
            exit 1
          fi

          sleep 5
          if ! curl --fail --silent --show-error http://127.0.0.1:3000/ >/dev/null; then
            echo "Health check failed; rolling back."
            if [ -n "$PREVIOUS_TARGET" ] && [ -d "$PREVIOUS_TARGET" ]; then
              ln -sfn "$PREVIOUS_TARGET" "$APP_DIR/current"
              chown -h ec2-user:ec2-user "$APP_DIR/current"
              sudo -iu ec2-user pm2 startOrRestart "$APP_DIR/ecosystem.config.cjs" --update-env || true
            fi
            exit 1
          fi

          sudo -iu ec2-user pm2 save
          echo "Deployment $RELEASE_ID completed successfully."
          REMOTE

          sed -i \
            -e "s/__RELEASE_ID__/${GITHUB_SHA}/g" \
            -e "s/__BUCKET__/${S3_BUCKET}/g" \
            "$RUNNER_TEMP/deploy-remote.sh"

          PARAMETERS="$(jq -cn --rawfile script "$RUNNER_TEMP/deploy-remote.sh" \
            '{commands: [$script]}')"

          COMMAND_ID="$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy ngo-fe ${GITHUB_SHA}" \
            --parameters "$PARAMETERS" \
            --query 'Command.CommandId' \
            --output text)"

          echo "SSM command: $COMMAND_ID"
          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "$EC2_INSTANCE_ID"

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$EC2_INSTANCE_ID" \
            --query '{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}' \
            --output json
